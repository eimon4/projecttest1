services:
  - type: web
    name: procurement-system
    runtime: node
    plan: free
    buildCommand: npm run setup && npm run build
    startCommand: npm start
    preDeployCommand: npm run db:init
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: procurement-db
          property: connectionString

databases:
  - name: procurement-db
    plan: free
    databaseName: office_procurement
    user: procurement_user
